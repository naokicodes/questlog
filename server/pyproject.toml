[project]
name = "questlog-server"
version = "0.1.0"
description = "Questlog server: quests, journal, sessions, and the phone gate"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI puts Depends()/Form()/File() and list defaults in signatures by design.
ignore = ["B006", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
